<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOUS Studio — Clay 3D Print</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0c0c0c;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      overflow:hidden; width:100vw; height:100vh; color:#e0e0e0;
    }
    #canvas-container { position:absolute; inset:0; }

    /* ── LOADING ── */
    #loading {
      position:absolute; inset:0; z-index:20;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:18px;
      background:#0c0c0c;
      transition:opacity .6s ease;
    }
    #loading.fade { opacity:0; pointer-events:none; }
    #loading-title {
      font-size:10px; letter-spacing:.3em;
      text-transform:uppercase; color:#333;
    }
    #loading-label {
      font-size:10px; letter-spacing:.15em;
      text-transform:uppercase; color:#444;
    }
    #loading-bar-wrap {
      width:160px; height:1px; background:rgba(255,255,255,.05);
    }
    #loading-bar {
      height:100%; width:0%; background:#c8a882;
      transition:width .15s linear;
    }

    /* ── BOTTOM UI ── */
    #ui {
      position:absolute; bottom:0; left:0; right:0;
      padding:18px 28px 22px;
      background:linear-gradient(transparent,rgba(0,0,0,.82));
      display:flex; flex-direction:column; gap:10px;
    }
    #info-row { display:flex; justify-content:space-between; align-items:flex-end; }
    #left-info h1 {
      font-size:11px; font-weight:300;
      letter-spacing:.2em; text-transform:uppercase; color:#555;
    }
    #left-info h2 {
      font-size:10px; font-weight:300;
      letter-spacing:.1em; color:#2e2e2e; margin-top:3px;
    }
    #layer-display {
      font-size:32px; font-weight:200;
      letter-spacing:.04em; color:#fff; text-align:right; line-height:1;
    }
    #layer-display small { font-size:11px; color:#3a3a3a; margin-left:3px; }
    #prog-wrap { width:100%; height:1px; background:rgba(255,255,255,.05); }
    #prog-bar  { height:100%; width:0%; background:#c8a882; transition:width .08s; }
    #controls  { display:flex; align-items:center; gap:14px; }
    button {
      background:none; border:1px solid rgba(255,255,255,.12);
      color:#666; padding:5px 14px; font-size:10px;
      letter-spacing:.14em; text-transform:uppercase;
      cursor:pointer; border-radius:2px; transition:all .15s;
    }
    button:hover { color:#fff; border-color:rgba(255,255,255,.28); }
    button.on { background:#c8a882; border-color:#c8a882; color:#000; }
    #spd-label { font-size:10px; color:#2e2e2e; letter-spacing:.1em; }
    input[type=range] {
      -webkit-appearance:none; width:72px; height:1px;
      background:rgba(255,255,255,.1); outline:none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; width:9px; height:9px;
      border-radius:50%; background:#c8a882; cursor:pointer;
    }
    #hint {
      position:absolute; top:18px; left:24px;
      font-size:9px; color:#222; letter-spacing:.1em; line-height:2;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════
     CONFIGURACION  ← editar aqui
══════════════════════════════════ -->
<script>
  // URL del archivo gcode en GitHub Pages
  var GCODE_URL = "https://ious-studio.github.io/tile-printing-viewer/ious%20studio_grupo%20msh_sample_30x30_gh.gcode";

  // Etiquetas UI
  var LABEL_TITLE = "Clay 3D Print";
  var LABEL_SUB   = "IOUS Studio — WASP 40100";

  // Colores
  var COLOR_PRINT  = 0xc8a882;  // arcilla
  var COLOR_BG     = 0x0c0c0c;  // fondo
</script>
<!-- ══════════════════════════════════ -->

<div id="loading">
  <div id="loading-title">IOUS Studio</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-label">cargando...</div>
</div>

<div id="canvas-container"></div>

<div id="hint">drag → rotar &nbsp;·&nbsp; scroll → zoom &nbsp;·&nbsp; right drag → pan</div>

<div id="ui">
  <div id="info-row">
    <div id="left-info">
      <h1 id="ui-title">Clay 3D Print</h1>
      <h2 id="ui-sub">IOUS Studio — WASP 40100</h2>
    </div>
    <div id="layer-display">
      <span id="ui-layer">0</span><small id="ui-total">/ 0 layers</small>
    </div>
  </div>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <div id="controls">
    <button id="btn-play" class="on">PLAY</button>
    <button id="btn-restart">RESTART</button>
    <span id="spd-label">SPEED</span>
    <input type="range" id="speed-slider" min="1" max="8" value="3">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ================================================================
//  PARSER: gcode → capas de lineas
//  Cada capa = array de segmentos { from: V3, to: V3 }
// ================================================================
function parseGcode(text) {
  var lines = text.split('\n');
  var cx=0, cy=0, cz=0, prevE=0;
  var layers = [];    // layers[i] = array de puntos de impresion
  var layerMap = {};  // zKey → array de puntos

  for (var i=0; i<lines.length; i++) {
    var l = lines[i].trim();
    if (!l || l[0]===';') continue;
    if (l.indexOf('G1') !== 0) continue;

    var xm=l.match(/X([\-\d\.]+)/), ym=l.match(/Y([\-\d\.]+)/);
    var zm=l.match(/Z([\-\d\.]+)/), em=l.match(/E([\-\d\.]+)/);

    var nx = xm ? parseFloat(xm[1]) : cx;
    var ny = ym ? parseFloat(ym[1]) : cy;
    var nz = zm ? parseFloat(zm[1]) : cz;
    var ne = em ? parseFloat(em[1]) : prevE;

    var moved    = (nx!==cx || ny!==cy);
    var extrudes = em && (ne > prevE) && moved;

    if (moved && extrudes) {
      var zk = Math.round(nz * 10) / 10;
      if (!layerMap[zk]) layerMap[zk] = [];
      // from → to en espacio Three.js (Y=arriba = Z del gcode)
      layerMap[zk].push(
        new THREE.Vector3(cx, cz, -cy),
        new THREE.Vector3(nx, nz, -ny)
      );
    }

    cx=nx; cy=ny; cz=nz; prevE=ne;
  }

  // Ordenar capas por Z
  var zKeys = Object.keys(layerMap)
    .map(parseFloat)
    .filter(function(v,i,a){ return a.indexOf(v)===i; })
    .sort(function(a,b){ return a-b; });

  return { layerMap:layerMap, zKeys:zKeys };
}

// ================================================================
//  ESCENA
// ================================================================
var scene, camera, renderer;
var layerObjects = [];   // THREE.LineSegments por capa
var printHead;
var parsed = null;
var currentLayer = 0;
var totalLayers  = 0;
var playing = false;
var speed   = 3;
var animTimer = null;

// Orbit state
var orbitTarget = new THREE.Vector3(0,150,0);
var orbitTheta  = 0.5, orbitPhi = 1.05, orbitRadius = 700;

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(COLOR_BG);
  scene.fog = new THREE.Fog(COLOR_BG, 800, 2000);

  camera = new THREE.PerspectiveCamera(
    42, window.innerWidth/window.innerHeight, 0.5, 4000);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Grid sutil
  var grid = new THREE.GridHelper(600, 20, 0x151515, 0x111111);
  scene.add(grid);

  // Print head
  var hg = new THREE.SphereGeometry(4,8,8);
  var hm = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.5});
  printHead = new THREE.Mesh(hg, hm);
  printHead.visible = false;
  scene.add(printHead);

  addOrbitControls();
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
  updateOrbit();
}

// ================================================================
//  CONSTRUIR LINE SEGMENTS POR CAPA
// ================================================================
function buildLayers(parsedData) {
  // Limpiar escena
  for (var i=0; i<layerObjects.length; i++) scene.remove(layerObjects[i]);
  layerObjects = [];

  var mat = new THREE.LineBasicMaterial({ color: new THREE.Color(COLOR_PRINT) });
  var total = parsedData.zKeys.length;

  for (var li=0; li<total; li++) {
    var zk = parsedData.zKeys[li];
    var pts = parsedData.layerMap[zk];
    if (!pts || pts.length < 2) continue;

    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    var obj = new THREE.LineSegments(geo, mat);
    obj.visible = false;
    scene.add(obj);
    layerObjects.push(obj);

    // Progreso de construccion
    document.getElementById('loading-bar').style.width =
      Math.round((li/total)*100) + '%';
  }
}

// ================================================================
//  CAMARA — centrar en modelo
// ================================================================
function centerCamera(parsedData) {
  var allPts = [];
  for (var k in parsedData.layerMap) {
    var pts = parsedData.layerMap[k];
    for (var i=0; i<pts.length; i++) allPts.push(pts[i]);
  }
  if (!allPts.length) return;

  var box = new THREE.Box3().setFromPoints(allPts);
  box.getCenter(orbitTarget);
  var size = new THREE.Vector3();
  box.getSize(size);
  orbitRadius = Math.max(size.x, size.y, size.z) * 1.8;
  updateOrbit();
}

// ================================================================
//  ANIMACION
// ================================================================
function revealLayer() {
  if (currentLayer >= layerObjects.length) {
    playing = false; setBtnPlay(false); return;
  }

  layerObjects[currentLayer].visible = true;

  // Mover print head al ultimo punto de la capa
  var zk  = parsed.zKeys[currentLayer];
  var pts = parsed.layerMap[zk];
  if (pts && pts.length >= 2) {
    printHead.position.copy(pts[pts.length-1]);
    printHead.visible = true;
  }

  currentLayer++;
  var pct = totalLayers > 0 ? (currentLayer/totalLayers*100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('ui-layer').textContent = currentLayer;

  if (playing) {
    var ms = Math.max(16, 350 / (speed * speed));
    animTimer = setTimeout(revealLayer, ms);
  }
}

function resetAnimation() {
  if (animTimer) clearTimeout(animTimer);
  for (var i=0; i<layerObjects.length; i++) layerObjects[i].visible = false;
  printHead.visible = false;
  currentLayer = 0;
  document.getElementById('prog-bar').style.width = '0%';
  document.getElementById('ui-layer').textContent = '0';
}

function startAnimation() {
  playing = true; setBtnPlay(true); revealLayer();
}

function setBtnPlay(on) {
  var b = document.getElementById('btn-play');
  b.textContent = on ? 'PAUSE' : 'PLAY';
  on ? b.classList.add('on') : b.classList.remove('on');
}

// ================================================================
//  CARGA
// ================================================================
function onGcodeLoaded(text) {
  document.getElementById('loading-label').textContent = 'procesando geometría...';
  document.getElementById('loading-bar').style.width = '0%';

  setTimeout(function() {
    parsed      = parseGcode(text);
    totalLayers = parsed.zKeys.length;
    buildLayers(parsed);
    centerCamera(parsed);

    document.getElementById('ui-total').textContent = '/ ' + totalLayers + ' layers';
    document.getElementById('loading-bar').style.width = '100%';

    // Fade out loading screen
    setTimeout(function() {
      document.getElementById('loading').classList.add('fade');
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 700);
      resetAnimation();
      startAnimation();
    }, 300);
  }, 60);
}

// ================================================================
//  ORBIT CONTROLS
// ================================================================
function updateOrbit() {
  camera.position.x = orbitTarget.x + orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta);
  camera.position.y = orbitTarget.y + orbitRadius * Math.cos(orbitPhi);
  camera.position.z = orbitTarget.z + orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta);
  camera.lookAt(orbitTarget);
}

function addOrbitControls() {
  var dom = renderer.domElement;
  var md=false, rd=false, lx=0, ly=0;

  dom.addEventListener('mousedown', function(e){
    if(e.button===0) md=true; if(e.button===2) rd=true;
    lx=e.clientX; ly=e.clientY;
  });
  window.addEventListener('mouseup', function(){ md=false; rd=false; });
  window.addEventListener('mousemove', function(e){
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(md){
      orbitTheta -= dx*0.005;
      orbitPhi = Math.max(.05, Math.min(Math.PI-.05, orbitPhi-dy*.005));
      updateOrbit();
    }
    if(rd){
      var f = orbitRadius*0.001;
      orbitTarget.x -= Math.cos(orbitTheta)*dx*f;
      orbitTarget.z += Math.sin(orbitTheta)*dx*f;
      orbitTarget.y += dy*f*.8;
      updateOrbit();
    }
  });
  dom.addEventListener('wheel', function(e){
    orbitRadius = Math.max(30, Math.min(3000, orbitRadius+e.deltaY*.4));
    updateOrbit();
  },{passive:true});
  dom.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // Touch
  var touches={}, prevPinch=null;
  dom.addEventListener('touchstart',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++)
      touches[e.changedTouches[i].identifier]=e.changedTouches[i];
  },{passive:false});
  dom.addEventListener('touchmove',function(e){
    e.preventDefault();
    var ids=Object.keys(touches);
    if(ids.length===1){
      var t=e.changedTouches[0], prev=touches[t.identifier];
      orbitTheta-=(t.clientX-prev.clientX)*.007;
      orbitPhi=Math.max(.05,Math.min(Math.PI-.05,orbitPhi-(t.clientY-prev.clientY)*.007));
      updateOrbit(); touches[t.identifier]=t;
    } else if(e.touches.length>=2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
      if(prevPinch!==null){
        orbitRadius=Math.max(30,Math.min(3000,orbitRadius-(d-prevPinch)*1.5));
        updateOrbit();
      }
      prevPinch=d;
    }
    for(var i=0;i<e.changedTouches.length;i++)
      touches[e.changedTouches[i].identifier]=e.changedTouches[i];
  },{passive:false});
  dom.addEventListener('touchend',function(e){
    for(var i=0;i<e.changedTouches.length;i++)
      delete touches[e.changedTouches[i].identifier];
    prevPinch=null;
  });
}

// ================================================================
//  CONTROLES UI
// ================================================================
document.getElementById('btn-play').addEventListener('click', function(){
  if(!parsed) return;
  playing=!playing; setBtnPlay(playing);
  if(playing) revealLayer();
  else if(animTimer) clearTimeout(animTimer);
});
document.getElementById('btn-restart').addEventListener('click', function(){
  if(!parsed) return;
  if(animTimer) clearTimeout(animTimer);
  resetAnimation(); startAnimation();
});
document.getElementById('speed-slider').addEventListener('input', function(e){
  speed=parseInt(e.target.value);
});

// ================================================================
//  ARRANQUE
// ================================================================
initScene();

fetch(GCODE_URL)
  .then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    // Progreso de descarga aproximado
    var total = parseInt(res.headers.get('content-length')||'0');
    if(!res.body || !total) return res.text();
    var reader = res.body.getReader();
    var received = 0;
    var chunks = [];
    function read(){
      return reader.read().then(function(r){
        if(r.done){
          var all = new Uint8Array(received);
          var pos = 0;
          for(var i=0;i<chunks.length;i++){
            all.set(chunks[i],pos); pos+=chunks[i].length;
          }
          return new TextDecoder().decode(all);
        }
        chunks.push(r.value);
        received += r.value.length;
        document.getElementById('loading-bar').style.width =
          Math.round((received/total)*80)+'%';
        return read();
      });
    }
    return read();
  })
  .then(function(text){ onGcodeLoaded(text); })
  .catch(function(err){
    document.getElementById('loading-label').textContent =
      'Error cargando archivo. Verifica la URL.';
    console.error(err);
  });
</script>
</body>
</html>
